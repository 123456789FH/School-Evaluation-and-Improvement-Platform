<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6b4b">
  <meta name="description" content="منصة مؤسسية مدرسية للتقويم والتحسين والقيادة والخطط وقياس الأثر والتقارير">
  <title>منصة التقويم والتحسين المدرسي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/styles.css?v=4.1.0">

  <!-- V4.1 Visual Identity Layer: visual-only; no analytical functions are changed. -->
  <style id="v4-1-visual-polish">
    :root{
      --route-a:#0f6b4b;
      --route-b:#0a4435;
      --route-soft:#edf8f2;
      --route-rgb:15,107,75;
      --route-gold:#b78b2a;
      --v41-radius:30px;
      --v41-shadow:0 22px 60px rgba(8,33,25,.095);
      --v41-card-shadow:0 10px 30px rgba(8,33,25,.055);
    }

    body[data-v4-route="dashboard"]{--route-a:#0f6b4b;--route-b:#083f32;--route-soft:#edf8f2;--route-rgb:15,107,75}
    body[data-v4-route="intelligence"]{--route-a:#51528f;--route-b:#273d62;--route-soft:#f1f2fb;--route-rgb:81,82,143}
    body[data-v4-route="assessment"]{--route-a:#1f7188;--route-b:#15566f;--route-soft:#edf8fb;--route-rgb:31,113,136}
    body[data-v4-route="operational"]{--route-a:#8b6a20;--route-b:#52642f;--route-soft:#fbf7ea;--route-rgb:139,106,32}
    body[data-v4-route="improvement"]{--route-a:#16815e;--route-b:#0e5946;--route-soft:#edf9f4;--route-rgb:22,129,94}
    body[data-v4-route="evidence"]{--route-a:#3a7192;--route-b:#27556f;--route-soft:#eff7fb;--route-rgb:58,113,146}
    body[data-v4-route="nafs"]{--route-a:#9a721e;--route-b:#55653a;--route-soft:#fbf6e9;--route-rgb:154,114,30}
    body[data-v4-route="leadership"],body[data-v4-route="plans"]{--route-a:#0e7652;--route-b:#174a3c;--route-soft:#eef8f2;--route-rgb:14,118,82}
    body[data-v4-route="guidance"]{--route-a:#3b6fa8;--route-b:#26577f;--route-soft:#eff6fc;--route-rgb:59,111,168}
    body[data-v4-route="activity"]{--route-a:#8a6092;--route-b:#5b496f;--route-soft:#f8f1f8;--route-rgb:138,96,146}
    body[data-v4-route="gifted"]{--route-a:#7460a5;--route-b:#504574;--route-soft:#f5f1fb;--route-rgb:116,96,165}
    body[data-v4-route="health"]{--route-a:#218988;--route-b:#276466;--route-soft:#edf9f8;--route-rgb:33,137,136}
    body[data-v4-route="partnership"]{--route-a:#2c7c71;--route-b:#315c55;--route-soft:#eef9f6;--route-rgb:44,124,113}
    body[data-v4-route="volunteer"]{--route-a:#a55468;--route-b:#744153;--route-soft:#fcf0f3;--route-rgb:165,84,104}
    body[data-v4-route="ai"]{--route-a:#5967a7;--route-b:#315f79;--route-soft:#f1f3fc;--route-rgb:89,103,167}
    body[data-v4-route="professional"]{--route-a:#4d7188;--route-b:#345868;--route-soft:#f0f7f9;--route-rgb:77,113,136}
    body[data-v4-route="events"]{--route-a:#9a6b2b;--route-b:#6d5934;--route-soft:#fcf7ed;--route-rgb:154,107,43}
    body[data-v4-route="satisfaction"]{--route-a:#986078;--route-b:#6e455d;--route-soft:#fbf1f5;--route-rgb:152,96,120}
    body[data-v4-route="reports"]{--route-a:#315f61;--route-b:#244b50;--route-soft:#f0f7f6;--route-rgb:49,95,97}
    body[data-v4-route="settings"]{--route-a:#61716a;--route-b:#40534b;--route-soft:#f2f6f4;--route-rgb:97,113,106}

    body{background:
      radial-gradient(circle at 6% 8%,rgba(var(--route-rgb),.055),transparent 24%),
      linear-gradient(180deg,#f8faf9 0%,#f5f8f6 100%);
      transition:background .3s ease;
    }

    .side-nav{border-left-color:rgba(var(--route-rgb),.16);box-shadow:-10px 0 34px rgba(8,33,25,.055)}
    .side-brand{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,var(--route-soft))}
    .side-brand:after{content:"";position:absolute;right:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--route-a),var(--route-gold),transparent);opacity:.7}
    .side-brand img{border:1px solid rgba(var(--route-rgb),.12);background:#fff}
    .side-group-title{position:relative;padding-inline-start:14px;color:#83928b}
    .side-group-title:before{content:"";position:absolute;right:2px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--route-a);transform:translateY(-50%);opacity:.45}
    .side-link{border:1px solid transparent}
    .side-link:hover{background:var(--route-soft);border-color:rgba(var(--route-rgb),.08);color:var(--route-b)}
    .side-link.active{background:linear-gradient(135deg,var(--route-b),var(--route-a));box-shadow:0 9px 22px rgba(var(--route-rgb),.22);border-color:rgba(255,255,255,.16)}
    .side-icon{background:rgba(var(--route-rgb),.08);color:var(--route-b)}
    .side-link.active .side-icon{color:#fff}
    .side-foot{background:linear-gradient(180deg,#fff,var(--route-soft));position:relative}
    .side-foot:before{content:"تصميم وتطوير";display:block;font-size:9px;color:#8b9892;margin-bottom:2px;font-weight:800}

    .topbar{border-bottom-color:rgba(var(--route-rgb),.14);box-shadow:0 6px 22px rgba(8,33,25,.025)}
    .top-current>span{background:var(--route-soft);border-color:rgba(var(--route-rgb),.16);color:var(--route-b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
    .top-current strong{color:var(--route-b)}
    .top-action:hover{background:var(--route-soft);border-color:rgba(var(--route-rgb),.16);color:var(--route-b)}

    .hero-v4{padding-top:28px}
    .hero-v4-grid{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--v41-radius);border:1px solid rgba(var(--route-rgb),.17);background:
      radial-gradient(circle at 92% 12%,rgba(255,255,255,.95),transparent 28%),
      linear-gradient(135deg,#fff 0%,var(--route-soft) 58%,rgba(var(--route-rgb),.09) 100%);
      box-shadow:var(--v41-shadow);
    }
    .hero-v4-grid:before{content:"";position:absolute;inset:0;z-index:-2;background-image:
      linear-gradient(rgba(var(--route-rgb),.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(var(--route-rgb),.045) 1px,transparent 1px);
      background-size:38px 38px;mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.35) 58%,transparent 100%);opacity:.7}
    .hero-v4-grid:after{content:"";position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;right:-160px;bottom:-210px;background:rgba(var(--route-rgb),.09);box-shadow:0 0 0 48px rgba(var(--route-rgb),.035)}
    .hero-v4-copy{position:relative;padding:38px 40px 36px}
    .hero-v4-copy:before{content:"";position:absolute;right:18px;top:38px;bottom:38px;width:4px;border-radius:99px;background:linear-gradient(180deg,var(--route-a),var(--route-gold));opacity:.9}
    .hero-v4 h1{color:var(--route-b);font-weight:950;letter-spacing:-.8px;text-wrap:balance}
    .hero-v4 p{color:#4a645b!important;line-height:1.9;max-width:780px}
    .hero-v4 .kicker{background:rgba(var(--route-rgb),.085);border-color:rgba(var(--route-rgb),.18);color:var(--route-b);font-weight:900}
    .hero-v4 .kicker:before{color:var(--route-gold)}
    .hero-tags{gap:7px}.hero-tags .chip{border-color:rgba(var(--route-rgb),.14);box-shadow:0 3px 12px rgba(8,33,25,.025);color:var(--route-b)}

    .hero-v4-art{position:relative;min-height:320px;padding:16px;overflow:hidden;background:
      radial-gradient(circle at 65% 30%,rgba(255,255,255,.98),rgba(255,255,255,.35) 32%,transparent 61%),
      linear-gradient(145deg,rgba(var(--route-rgb),.14),rgba(255,255,255,.58));
    }
    .hero-v4-art:before,.hero-v4-art:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .hero-v4-art:before{width:190px;height:190px;left:-70px;top:-74px;background:rgba(var(--route-rgb),.12);box-shadow:0 0 0 25px rgba(var(--route-rgb),.035)}
    .hero-v4-art:after{width:84px;height:84px;right:24px;bottom:18px;background:rgba(183,139,42,.12);box-shadow:0 0 0 16px rgba(183,139,42,.035)}
    .hero-v4-art img{position:relative;z-index:2;width:100%;height:100%;min-height:288px;object-fit:cover;border-radius:22px;border:1px solid rgba(255,255,255,.88);box-shadow:0 18px 42px rgba(8,33,25,.12);filter:saturate(.98) contrast(1.015);transition:transform .45s ease,filter .45s ease}
    .hero-v4-grid:hover .hero-v4-art img{transform:translateY(-3px) scale(1.008);filter:saturate(1.03) contrast(1.02)}

    .btn{border-radius:13px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--route-b),var(--route-a));border-color:var(--route-a);box-shadow:0 7px 18px rgba(var(--route-rgb),.15)}
    .btn-gold{box-shadow:0 7px 18px rgba(183,139,42,.12)}

    .section{position:relative}
    .section-title{color:#173b30;position:relative;padding-inline-start:16px}
    .section-title:before{content:"";position:absolute;right:0;top:.3em;bottom:.28em;width:4px;border-radius:99px;background:linear-gradient(180deg,var(--route-a),var(--route-gold))}
    .card{border-color:rgba(var(--route-rgb),.115);box-shadow:var(--v41-card-shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .card.hover:hover,.module-card:hover,.quick-card:hover{transform:translateY(-3px);border-color:rgba(var(--route-rgb),.25);box-shadow:0 18px 40px rgba(var(--route-rgb),.09)}
    .metric-card{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,rgba(255,255,255,.92))}
    .metric-card:before{content:"";position:absolute;right:0;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--route-a),var(--route-gold));opacity:.8}
    .metric-card .icon-pill,.module-icon,.icon-pill{background:var(--route-soft);border-color:rgba(var(--route-rgb),.15);color:var(--route-b)}
    .metric-value{color:var(--route-b)}
    .command-card{border-top-color:var(--route-gold)!important;background:linear-gradient(180deg,#fff,var(--route-soft))}

    .module-grid{gap:14px}
    .module-card{position:relative;overflow:hidden;border-color:rgba(var(--route-rgb),.12);box-shadow:var(--v41-card-shadow);min-height:88px}
    .module-card:after{content:"";position:absolute;right:auto;left:-34px;bottom:-42px;width:98px;height:98px;border-radius:50%;background:rgba(var(--route-rgb),.045);pointer-events:none}
    .module-card b{color:var(--route-a)}

    .focus-card{border-top-color:rgba(var(--route-rgb),.35);background:linear-gradient(180deg,#fff,var(--route-soft))}
    .tabs{scrollbar-width:thin}.tab.active{background:var(--route-soft);border-color:rgba(var(--route-rgb),.24);color:var(--route-b)}
    .bar i,.smart-progress span{background:linear-gradient(90deg,var(--route-a),#79c9a1)}
    .report{box-shadow:var(--v41-card-shadow)}
    .report-cover{background:linear-gradient(135deg,var(--route-soft),#fff)}

    @media(max-width:1180px){.hero-v4-copy{padding:32px 30px 30px}.hero-v4-copy:before{right:13px}}
    @media(max-width:980px){
      .hero-v4-art{order:-1;min-height:245px;padding:12px}
      .hero-v4-art img{min-height:220px;max-height:330px}
      .hero-v4-copy{padding:28px 26px}
      .hero-v4-copy:before{top:28px;bottom:28px}
    }
    @media(max-width:700px){
      .hero-v4-grid{border-radius:24px}
      .hero-v4-art{min-height:190px;padding:9px}.hero-v4-art img{min-height:172px;border-radius:17px}
      .hero-v4-copy{padding:22px 20px}.hero-v4-copy:before{right:9px;top:22px;bottom:22px;width:3px}
      .hero-v4 h1{font-size:29px}.hero-v4 p{font-size:13px;line-height:1.8}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}.hero-v4-grid:hover .hero-v4-art img{transform:none}}
    @media print{.hero-v4-grid:before,.hero-v4-grid:after,.side-brand:after{display:none!important}}
  </style>
</head>
<body>
  <div id="appHeader"></div>
  <main id="page"></main>
  <div id="appFooter"></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="assets/js/data.js?v=4.1.0"></script>
  <script src="assets/js/storage.js?v=4.1.0"></script>
  <script src="assets/js/engine.js?v=4.1.0"></script>
  <script src="assets/js/document-intelligence.js?v=4.1.0"></script>
  <script src="assets/js/report-export.js?v=4.1.0"></script>
  <script src="assets/js/app.js?v=4.1.0"></script>

  <!-- V4.1 route-aware visual enhancer. It never writes to Store/state. -->
  <script id="v4-1-visual-runtime">
    (function(){
      'use strict';
      const currentRoute=()=>((location.hash||'#dashboard').replace(/^#/,'').split('?')[0]||'dashboard');
      const applyRouteIdentity=()=>{
        const r=currentRoute();
        document.body.dataset.v4Route=r;
        document.documentElement.dataset.platformVersion='4.1';
        document.querySelectorAll('.side-link').forEach(a=>{
          const active=a.getAttribute('href')==='#'+r;
          if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
        });
        const hero=document.querySelector('.hero-v4-grid');
        if(hero)hero.setAttribute('data-route',r);
      };
      window.addEventListener('hashchange',()=>requestAnimationFrame(applyRouteIdentity));
      window.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(applyRouteIdentity));
      window.addEventListener('load',applyRouteIdentity);

      // Force the new service worker to bypass the browser HTTP cache when checking for updates.
      if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('./sw.js?v=4.1.0',{updateViaCache:'none'})
            .then(reg=>reg.update())
            .catch(()=>{});
        });
      }
    })();
  </script>
</body>
</html>
